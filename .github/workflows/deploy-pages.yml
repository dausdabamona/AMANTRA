# Deploy AMANTRA Frontend to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches: ["main", "master"]
    paths:
      - 'frontend/**'

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build with Next.js
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Add .nojekyll file
        run: touch frontend/out/.nojekyll

      - name: Create 404.html for SPA routing
        run: cp frontend/out/index.html frontend/out/404.html 2>/dev/null || cp frontend/out/id/index.html frontend/out/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
